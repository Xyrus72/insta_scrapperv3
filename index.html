<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Instagram Profile Scraper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #fafafa;
      color: #262626;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
      padding: 24px;
      text-align: center;
      color: #fff;
    }
    header h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: 1px; }
    header p  { margin-top: 4px; opacity: .85; font-size: .95rem; }

    /* ── Search box ── */
    .search-wrap {
      max-width: 560px;
      margin: 36px auto 0;
      padding: 0 16px;
      display: flex;
      gap: 10px;
    }
    .search-wrap input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #dbdbdb;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color .2s;
    }
    .search-wrap input:focus { border-color: #833ab4; }

    .search-wrap select {
      padding: 12px 10px;
      border: 2px solid #dbdbdb;
      border-radius: 10px;
      font-size: .9rem;
      outline: none;
      cursor: pointer;
    }

    .search-wrap button {
      padding: 12px 22px;
      background: linear-gradient(135deg, #833ab4, #fd1d1d);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
    }
    .search-wrap button:hover { opacity: .88; }
    .search-wrap button:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Status / error ── */
    #status {
      text-align: center;
      margin: 20px auto;
      max-width: 560px;
      font-size: .95rem;
      color: #888;
      padding: 0 16px;
    }
    #status.error { color: #ed4956; font-weight: 600; }

    /* ── Main content ── */
    #content {
      max-width: 860px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }

    /* ── Profile card ── */
    .profile-card {
      background: #fff;
      border: 1px solid #dbdbdb;
      border-radius: 14px;
      padding: 24px 28px;
      margin-bottom: 28px;
      display: flex;
      gap: 28px;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .profile-avatar {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; color: #fff; flex-shrink: 0;
    }
    .profile-info { flex: 1; min-width: 200px; }
    .profile-info h2 { font-size: 1.3rem; font-weight: 700; }
    .profile-info .handle { color: #888; font-size: .9rem; margin-bottom: 8px; }
    .profile-info .bio { font-size: .92rem; color: #555; line-height: 1.5; }
    .profile-info .website a { color: #833ab4; font-size: .9rem; text-decoration: none; }

    .stats-row {
      display: flex; gap: 28px; margin-top: 16px; flex-wrap: wrap;
    }
    .stat-box { text-align: center; }
    .stat-box .num { font-size: 1.3rem; font-weight: 700; }
    .stat-box .lbl { font-size: .78rem; color: #888; text-transform: uppercase; letter-spacing: .5px; }

    /* ── Summary bar ── */
    .summary-bar {
      display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px;
    }
    .summary-item {
      flex: 1; min-width: 130px;
      background: #fff;
      border: 1px solid #dbdbdb;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
    .summary-item .s-num { font-size: 1.4rem; font-weight: 700; color: #833ab4; }
    .summary-item .s-lbl { font-size: .78rem; color: #888; margin-top: 4px; }

    /* ── Posts table ── */
    .section-title {
      font-size: 1rem; font-weight: 700; margin-bottom: 12px;
      color: #262626; letter-spacing: .3px;
    }

    table {
      width: 100%; border-collapse: collapse;
      background: #fff;
      border: 1px solid #dbdbdb;
      border-radius: 12px;
      overflow: hidden;
    }
    thead { background: linear-gradient(135deg, #833ab4, #fd1d1d); color: #fff; }
    thead th { padding: 12px 14px; text-align: left; font-size: .85rem; font-weight: 600; }
    tbody tr { border-bottom: 1px solid #f0f0f0; transition: background .15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #faf5ff; }
    tbody td { padding: 11px 14px; font-size: .88rem; vertical-align: middle; }
    tbody td a { color: #833ab4; text-decoration: none; font-weight: 500; }
    tbody td a:hover { text-decoration: underline; }
    .likes-cell { color: #ed4956; font-weight: 600; }
    .comments-cell { color: #0095f6; font-weight: 600; }

    /* ── Spinner ── */
    .spinner {
      width: 36px; height: 36px; margin: 30px auto;
      border: 4px solid #f0f0f0;
      border-top-color: #833ab4;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <h1>📸 Instagram Profile Scraper</h1>
  <p>Enter a public username to see followers, posts, likes &amp; comments</p>
</header>

<div class="search-wrap">
  <input id="usernameInput" type="text" placeholder="Instagram username (without @)" />
  <select id="maxPosts">
    <option value="5">5 posts</option>
    <option value="10">10 posts</option>
    <option value="20" selected>20 posts</option>
    <option value="50">50 posts</option>
  </select>
  <button id="searchBtn" onclick="runScrape()">Search</button>
</div>

<div id="status"></div>
<div id="content"></div>

<script>
  // Allow pressing Enter in the input
  document.getElementById("usernameInput").addEventListener("keydown", e => {
    if (e.key === "Enter") runScrape();
  });

  function fmt(n) {
    return Number(n).toLocaleString();
  }

  async function runScrape() {
    const username  = document.getElementById("usernameInput").value.trim().replace(/^@/, "");
    const maxPosts  = parseInt(document.getElementById("maxPosts").value);
    const statusEl  = document.getElementById("status");
    const contentEl = document.getElementById("content");
    const btn       = document.getElementById("searchBtn");

    if (!username) {
      statusEl.className = "error";
      statusEl.textContent = "Please enter a username.";
      return;
    }

    // Loading state
    btn.disabled = true;
    statusEl.className = "";
    statusEl.innerHTML = "";
    contentEl.innerHTML = '<div class="spinner"></div>';

    try {
      const resp = await fetch("/scrape", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, max_posts: maxPosts })
      });

      const data = await resp.json();

      if (!resp.ok) {
        statusEl.className = "error";
        statusEl.textContent = "❌ " + (data.error || "Unknown error");
        contentEl.innerHTML = "";
        return;
      }

      statusEl.textContent = "";
      renderResults(data);

    } catch (err) {
      statusEl.className = "error";
      statusEl.textContent = "❌ Could not connect to server. Make sure server.py is running.";
      contentEl.innerHTML = "";
    } finally {
      btn.disabled = false;
    }
  }

  function renderResults(data) {
    const { profile, posts, summary } = data;
    const el = document.getElementById("content");

    // Profile card
    const initial = (profile.full_name || profile.username || "?")[0].toUpperCase();
    const websiteHtml = profile.external_url
      ? `<div class="website" style="margin-top:6px"><a href="${profile.external_url}" target="_blank">${profile.external_url}</a></div>`
      : "";

    let html = `
      <div class="profile-card">
        <div class="profile-avatar">${initial}</div>
        <div class="profile-info">
          <h2>${profile.full_name || profile.username}</h2>
          <div class="handle">@${profile.username}</div>
          <div class="bio">${profile.biography || ""}</div>
          ${websiteHtml}
          <div class="stats-row">
            <div class="stat-box"><div class="num">${fmt(profile.mediacount)}</div><div class="lbl">Posts</div></div>
            <div class="stat-box"><div class="num">${fmt(profile.followers)}</div><div class="lbl">Followers</div></div>
            <div class="stat-box"><div class="num">${fmt(profile.followees)}</div><div class="lbl">Following</div></div>
          </div>
        </div>
      </div>
    `;

    // Summary bar
    html += `
      <div class="summary-bar">
        <div class="summary-item"><div class="s-num">${fmt(summary.posts_fetched)}</div><div class="s-lbl">Posts Fetched</div></div>
        <div class="summary-item"><div class="s-num">${fmt(summary.total_likes)}</div><div class="s-lbl">Total Likes</div></div>
        <div class="summary-item"><div class="s-num">${fmt(summary.total_comments)}</div><div class="s-lbl">Total Comments</div></div>
        <div class="summary-item"><div class="s-num">${fmt(summary.avg_likes)}</div><div class="s-lbl">Avg Likes / Post</div></div>
        <div class="summary-item"><div class="s-num">${fmt(summary.avg_comments)}</div><div class="s-lbl">Avg Comments / Post</div></div>
      </div>
    `;

    // Posts table
    if (posts.length > 0) {
      html += `<div class="section-title">📋 Posts — Likes &amp; Comments</div>`;
      html += `
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>❤️ Likes</th>
              <th>💬 Comments</th>
              <th>📅 Date</th>
              <th>Post Link</th>
            </tr>
          </thead>
          <tbody>
      `;
      posts.forEach(p => {
        html += `
          <tr>
            <td>${p.number}</td>
            <td class="likes-cell">${fmt(p.likes)}</td>
            <td class="comments-cell">${fmt(p.comments)}</td>
            <td>${p.date}</td>
            <td><a href="${p.url}" target="_blank">View Post ↗</a></td>
          </tr>
        `;
      });
      html += `</tbody></table>`;
    } else {
      html += `<p style="color:#888;text-align:center;margin-top:20px">No posts fetched. Instagram may have rate-limited the request.</p>`;
    }

    el.innerHTML = html;
  }
</script>

</body>
</html>
